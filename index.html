<!DOCTYPE html>
<html>
  <head>
    <title>P2P Test</title>
  </head>
  <body>
    <p>Your ID: <strong id="my-id">Generating...</strong></p>
    <input type="text" id="peer-id" placeholder="Enter remote Peer ID" />
    <button onclick="connectToPeer()">Connect</button>
    <br><br>

    <div id="connectedUsers"></div>

    <input type="text" id="name" placeholder="Username" />
    <button onclick="changeName()">Send</button>

    <input type="text" id="msg" placeholder="Message" />
    <button onclick="sendMessage()">Send</button>
    <div id="chat"></div>

    <script type="text/javascript" src="node_modules/peerjs/dist/peerjs.js"></script>
    <script type="text/javascript" src="connection.js"></script>
  </body>
</html>
